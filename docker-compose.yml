# Pinned so data volumes keep the same names wherever this folder lives.
name: rebuild

# One command to run everything:  docker compose up --build
# Then open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        PREFETCH_EMBEDDINGS: ${PREFETCH_EMBEDDINGS:-true}
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/doc2learn
      # Named LLM_* so an OPENROUTER_API_KEY exported in your shell can't override .env.
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-flash-latest}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # Browser addresses allowed to connect. Add http://<your-ip>:8080 for devices on your Wi-Fi.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # Address shown in quiz invite links (e.g. http://192.168.1.9:8080). Optional.
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
    volumes:
      - embedding_models:/models
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"   # handy for curl/health checks; the UI goes through nginx

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
  embedding_models:
